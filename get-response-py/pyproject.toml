[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getresponse"
version = "0.1.0"
description = "Async, fully-typed Python client for the GetResponse v3 API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sistemi Tre" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.urls]
Repository = "https://github.com/sistemitre/get-response"
Issues = "https://github.com/sistemitre/get-response/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["getresponse"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
