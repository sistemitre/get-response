# Publish pipeline for the three GetResponse API client packages, to their public registries
# (nuget.org, PyPI, npm). Runs only when a `vX.Y.Z` tag is pushed -- everyday commits don't
# trigger it (see ci.yml for that). All three packages share one version, taken from the tag,
# matching the monorepo's "one spec, one generator" philosophy: a release is one coherent
# snapshot of all three libraries, not three independently versioned ones. See
# CLAUDE.md / README.md "Versioning" section for the SemVer policy.
#
# One-time setup required before this workflow can publish anything:
#   1. All three registries use Trusted Publishing (OIDC) -- no stored token, ever:
#        - pypi.org/manage/account/publishing/ -> add a pending publisher: owner `sistemitre`,
#          repo `get-response`, workflow `release.yml`, environment `pypi`.
#        - nuget.org -> username menu -> Trusted Publishing -> add a policy: repository owner
#          `sistemitre`, repository `get-response`, workflow `release.yml`, environment `nuget`.
#          The policy is created under an individual nuget.org account (currently
#          `matteorosani`), not the `sistemitre` org itself -- that account is what
#          `NuGet/login`'s `user:` input below must match.
#        - npmjs.com/package/@sistemitre/getresponse/access -> Trusted Publisher -> add GitHub
#          Actions: repo `sistemitre/get-response`, workflow `release.yml`, environment `npm`.
#          Unlike PyPI/NuGet, npm's Trusted Publisher can only be configured from an *existing*
#          package's settings page -- `@sistemitre/getresponse` must already be published once
#          (manually: `npm login && npm publish --access public` from `get-response-ts/`)
#          before this can be set up, and before this job's OIDC publish will work.
#   2. `@sistemitre/getresponse` is scoped to the org, so it publishes as private by default --
#      `npm publish --access public` below is required, not optional.
#   3. Create the `pypi`, `nuget`, and `npm` GitHub Environments (Settings -> Environments) so
#      the `environment:` on each job below has something to match against.
#   4. Verify the three package names are actually available (or already owned by this team)
#      before the first real run: `getresponse` on PyPI, `@sistemitre/getresponse` on npm,
#      `GetResponse.Api` on NuGet.

name: Release

on:
  push:
    tags: ['v*']

jobs:
  # -----------------------------------------------------------------------------------
  publish-python:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version from tag
        id: version
        run: |
          set -e
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -1)
          if [ -z "$TAG" ]; then
            echo "::error::HEAD is not exactly on a vX.Y.Z tag -- refusing to publish."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION (tag $TAG)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set version from tag
        working-directory: get-response-py
        run: sed -i "s/^version = .*/version = \"${{ steps.version.outputs.value }}\"/" pyproject.toml

      - name: Install
        working-directory: get-response-py
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'

      - name: Lint, type-check, test
        working-directory: get-response-py
        run: |
          set -e
          python -m ruff check getresponse
          python -m ruff format --check getresponse
          python -m mypy getresponse
          python -m pytest tests -q

      - name: Build sdist/wheel
        working-directory: get-response-py
        run: |
          set -e
          python -m pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: get-response-py/dist

  # -----------------------------------------------------------------------------------
  publish-csharp:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version from tag
        id: version
        run: |
          set -e
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -1)
          if [ -z "$TAG" ]; then
            echo "::error::HEAD is not exactly on a vX.Y.Z tag -- refusing to publish."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION (tag $TAG)"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Restore
        working-directory: get-response-cs
        run: dotnet restore GetResponse.sln

      - name: Build
        working-directory: get-response-cs
        run: dotnet build GetResponse.sln -c Release --no-restore

      - name: Verify formatting
        working-directory: get-response-cs
        run: dotnet format GetResponse.sln --verify-no-changes

      - name: Test
        working-directory: get-response-cs
        run: dotnet test GetResponse.sln -c Release --no-build

      - name: Pack
        working-directory: get-response-cs
        run: |
          set -e
          dotnet pack GetResponse.Api/GetResponse.Api.csproj -c Release \
            -p:Version=${{ steps.version.outputs.value }} -o "${{ runner.temp }}/nuget"

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: matteorosani

      - name: Publish to nuget.org
        run: |
          set -e
          dotnet nuget push "${{ runner.temp }}/nuget/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate

  # -----------------------------------------------------------------------------------
  publish-typescript:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version from tag
        id: version
        run: |
          set -e
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -1)
          if [ -z "$TAG" ]; then
            echo "::error::HEAD is not exactly on a vX.Y.Z tag -- refusing to publish."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION (tag $TAG)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports OIDC Trusted Publishing (requires npm >=11.5.1)
        run: npm install -g npm@latest

      - name: Set version from tag
        working-directory: get-response-ts
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version

      - name: Install
        working-directory: get-response-ts
        run: npm ci

      - name: Build, lint, test
        working-directory: get-response-ts
        run: |
          set -e
          npm run build
          npm run lint
          npx prettier --check src
          npm test

      - name: Publish to npm
        working-directory: get-response-ts
        run: npm publish --access public
